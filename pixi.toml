[workspace]
authors = ["Mohamed Aly <mohamedaymanali@gmail.com>"]
channels = ["conda-forge"]
name = "hsf-india-diffprog-hackathon"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
python = "3.14.*"
awkward = ">=2.14.0,<3"
ipykernel = ">=7.4.0,<8"
jupyterlab = ">=4.6.5,<5"
matplotlib-base = ">=3.11.2,<4"
nbclient = ">=0.11.0,<0.12"
nbformat = ">=5.11.1,<6"
numpy = ">=2.5.4,<3"
uproot = ">=5.7.7,<6"

# jaxlib has no conda-forge build for win-64 and no PyPI wheel for osx-64
[target.unix.dependencies]
jax = ">=0.12.0.1,<0.13"

[target.win-64.pypi-dependencies]
jax = ">=0.12.0.1, <0.13"
