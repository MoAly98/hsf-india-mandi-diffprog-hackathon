name: hsf-india-diffprog-hackathon
channels:
  - conda-forge
dependencies:
  - python=3.14
  - awkward>=2.14.0,<3
  - ipykernel>=7.4.0,<8
  - jupyterlab>=4.6.5,<5
  - matplotlib-base>=3.11.2,<4
  - nbclient>=0.11.0,<0.12
  - nbformat>=5.11.1,<6
